<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Whale</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b0f19; color: #e2e8f0; font-family: system-ui, sans-serif; min-height: 100vh; padding: 16px; }
        .container { max-width: 460px; margin: 0 auto; }
        h1 { text-align: center; font-size: 1.3rem; color: #38bdf8; }
        .sub { text-align: center; color: #64748b; font-size: 0.75rem; margin-bottom: 18px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .card { background: #151b2d; border: 1px solid #1e293b; border-radius: 12px; padding: 14px; }
        .label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
        .val { font-size: 1rem; font-weight: 600; }
        .on { color: #4ade80; } .off { color: #f87171; }

        .actions { background: #151b2d; border: 1px solid #1e293b; border-radius: 14px; padding: 18px; margin-bottom: 16px; }
        .btn { width: 100%; padding: 14px; font-size: 1rem; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
        .btn:last-child { margin-bottom: 0; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-restart { background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; }
        .btn-restart:hover:not(:disabled) { transform: translateY(-1px); }
        .btn-apply { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white; }
        .btn-apply:hover:not(:disabled) { transform: translateY(-1px); }

        .spin { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,0.25); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .logs { background: #0d1117; border: 1px solid #1e293b; border-radius: 12px; padding: 14px; }
        .logs-head { display: flex; justify-content: space-between; font-size: 0.75rem; color: #475569; margin-bottom: 8px; }
        .logs-body { font-family: monospace; font-size: 0.78rem; color: #94a3b8; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }

        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e293b; color: #fff; padding: 12px 20px; border-radius: 10px; border: 1px solid #334155; font-size: 0.9rem; opacity: 0; transition: all 0.3s; z-index: 1000; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.ok { border-left: 3px solid #4ade80; }
        .toast.err { border-left: 3px solid #f87171; }

        .hint { text-align: center; color: #475569; font-size: 0.7rem; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐋 Blue Whale</h1>
        <p class="sub">Native Proxy Daemon</p>

        <div class="grid">
            <div class="card"><div class="label">Daemon</div><div class="val" id="st-d">...</div></div>
            <div class="card"><div class="label">Proxy</div><div class="val" id="st-p">...</div></div>
            <div class="card"><div class="label">Requests</div><div class="val" id="st-r">-</div></div>
            <div class="card"><div class="label">Uptime</div><div class="val" id="st-u">-</div></div>
        </div>

        <div class="actions">
            <button class="btn btn-restart" id="btn-r" onclick="doRestart()">
                <div class="spin" id="sp-r"></div>
                <span id="tx-r">🔄 Restart Proxy</span>
            </button>
            <button class="btn btn-apply" id="btn-a" onclick="doApply()">
                <div class="spin" id="sp-a"></div>
                <span id="tx-a">🔧 Apply System Bypass</span>
            </button>
        </div>

        <div class="logs">
            <div class="logs-head"><span>📋 Logs</span><span>Auto</span></div>
            <div class="logs-body" id="logs">Loading...</div>
        </div>
        <p class="hint">স্ট্যাটাস প্রতি ৩ সেকেন্ডে আপডেট</p>
    </div>

    <div class="toast" id="toast"><span id="t-ic">ℹ️</span> <span id="t-msg">Message</span></div>

    <script>
        async function load() {
            try {
                const d = await (await fetch('/api/status')).json();
                const de = document.getElementById('st-d'), pe = document.getElementById('st-p');
                if (d.daemon) { de.textContent = '● Online'; de.className = 'val on'; } else { de.textContent = '● Offline'; de.className = 'val off'; }
                if (d.proxy_running) { pe.textContent = '● Running'; pe.className = 'val on'; } else { pe.textContent = '● Stopped'; pe.className = 'val off'; }
                document.getElementById('st-r').textContent = d.requests ?? 0;
                document.getElementById('st-u').textContent = d.uptime_str ?? '-';
                document.getElementById('logs').textContent = d.log || 'No logs';
                document.getElementById('tx-r').textContent = d.proxy_running ? '🔄 Restart Proxy' : '🚀 Start Proxy';
            } catch (e) { document.getElementById('st-d').textContent = 'Error'; document.getElementById('st-d').className = 'val off'; }
        }

        async function call(url, bid, sid, tid, def, load) {
            const b = document.getElementById(bid), s = document.getElementById(sid), t = document.getElementById(tid);
            b.disabled = true; s.style.display = 'block'; t.textContent = load;
            try {
                const d = await (await fetch(url, {method:'POST'})).json();
                toast(d.success ? '✅ '+(d.message||'OK') : '❌ '+(d.message||'Fail'), d.success?'ok':'err');
            } catch (e) { toast('❌ Network error', 'err'); }
            finally { setTimeout(()=>{ b.disabled=false; s.style.display='none'; t.textContent=def; load(); }, 1200); }
        }

        function doRestart() {
            const running = document.getElementById('tx-r').textContent.includes('Restart');
            call('/api/restart', 'btn-r', 'sp-r', 'tx-r', running?'🔄 Restart Proxy':'🚀 Start Proxy', running?'Restarting...':'Starting...');
        }
        function doApply() { call('/api/apply', 'btn-a', 'sp-a', 'tx-a', '🔧 Apply System Bypass', 'Applying...'); }

        function toast(msg, type) {
            const t = document.getElementById('toast');
            document.getElementById('t-msg').textContent = msg;
            t.className = 'toast show ' + type;
            setTimeout(() => t.classList.remove('show'), 2800);
        }

        load();
        setInterval(load, 3000);
    </script>
</body>
</html>

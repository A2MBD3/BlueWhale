name: Build & Release

on:
  push:
    paths:
      - 'module/**'
      - '.github/workflows/**'
    branches:
      - main
  workflow_dispatch:  # ← ম্যানুয়াল ট্রিগার

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get Version
      id: version
      run: |
        VERSION=$(grep 'version=' module/module.prop | cut -d'=' -f2)
        VERSION_CODE=$(grep 'versionCode=' module/module.prop | cut -d'=' -f2)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "Version: $VERSION ($VERSION_CODE)"
    
    - name: Build ZIP
      run: |
        cd module
        zip -r9 ../BlueWhale-${{ steps.version.outputs.version }}.zip .
        cd ..
        ls -lh BlueWhale-${{ steps.version.outputs.version }}.zip
    
    - name: Create Tag
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        TAG="${{ steps.version.outputs.version }}"
        git tag -f $TAG
        git push origin $TAG --force
    
    - name: Delete Old Release
      run: |
        gh release delete ${{ steps.version.outputs.version }} --yes 2>/dev/null || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: BlueWhale ${{ steps.version.outputs.version }}
        files: BlueWhale-${{ steps.version.outputs.version }}.zip
        body: |
          ## 🐋 Blue Whale ${{ steps.version.outputs.version }}
          
          - **Version:** ${{ steps.version.outputs.version }}
          - **Version Code:** ${{ steps.version.outputs.version_code }}
          
          ### Installation
          1. Download ZIP → Install via Magisk/KSU
          2. Reboot
          3. Open WebUI
          
          ### Developer
          [@A2MBD3](https://t.me/A2MBD3)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Update update.json
      run: |
        cat > update.json << EOF
        {
            "version": "${{ steps.version.outputs.version }}",
            "versionCode": ${{ steps.version.outputs.version_code }},
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/BlueWhale-${{ steps.version.outputs.version }}.zip",
            "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/main/CHANGELOG.md"
        }
        EOF
    
    - name: Commit update.json
      run: |
        git add update.json
        git commit -m "Update to ${{ steps.version.outputs.version }}" || true
        git push origin main
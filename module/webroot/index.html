<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐋 Blue Whale</title>
    <style>
        :root {
            --bg: #060b1f;
            --surface: #101838;
            --surface2: #182048;
            --primary: #00c8ff;
            --green: #00e676;
            --red: #ff3d3d;
            --yellow: #ffc400;
            --text: #dce4ff;
            --text2: #8090b8;
            --radius: 18px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header .icon {
            font-size: 3.5rem;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            margin-top: 4px;
            letter-spacing: -0.5px;
        }
        .header .ver {
            font-size: 0.75rem;
            color: var(--text2);
            background: var(--surface);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 6px;
        }

        /* Status Card */
        .status-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        .dot.online {
            background: var(--green);
            box-shadow: 0 0 20px var(--green);
            animation: glow-green 2s infinite;
        }
        .dot.offline {
            background: var(--red);
            box-shadow: 0 0 20px var(--red);
            animation: glow-red 2s infinite;
        }
        .dot.checking {
            background: var(--yellow);
            box-shadow: 0 0 20px var(--yellow);
            animation: glow-yellow 1s infinite;
        }
        @keyframes glow-green {
            0%, 100% { box-shadow: 0 0 10px var(--green); }
            50% { box-shadow: 0 0 30px var(--green); }
        }
        @keyframes glow-red {
            0%, 100% { box-shadow: 0 0 10px var(--red); }
            50% { box-shadow: 0 0 30px var(--red); }
        }
        @keyframes glow-yellow {
            0%, 100% { box-shadow: 0 0 10px var(--yellow); }
            50% { box-shadow: 0 0 30px var(--yellow); }
        }

        .status-text {
            font-size: 1.3rem;
            font-weight: 700;
        }
        .status-detail {
            font-size: 0.8rem;
            color: var(--text2);
            margin-top: 4px;
        }

        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .info-item {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .info-item .val {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
        }
        .info-item .lbl {
            font-size: 0.7rem;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: var(--radius);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .btn-start {
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #000;
        }
        .btn-stop {
            background: linear-gradient(135deg, #d50000, #ff3d3d);
            color: #fff;
        }
        .btn-apply {
            background: var(--primary);
            color: #000;
        }
        .btn-outline {
            background: transparent;
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Logs */
        .log-section {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .log-section h3 {
            font-size: 0.85rem;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .log-section h3 .badge {
            font-size: 0.65rem;
            background: var(--surface2);
            padding: 2px 8px;
            border-radius: 10px;
            color: var(--primary);
        }
        #log {
            background: var(--bg);
            border-radius: 12px;
            padding: 14px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.7rem;
            color: var(--primary);
            max-height: 220px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.6;
        }
        #log::-webkit-scrollbar {
            width: 4px;
        }
        #log::-webkit-scrollbar-track {
            background: transparent;
        }
        #log::-webkit-scrollbar-thumb {
            background: var(--surface2);
            border-radius: 4px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: var(--primary);
            color: #000;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.85rem;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.7rem;
            color: var(--text2);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="icon">🐋</div>
            <h1>Blue Whale</h1>
            <span class="ver">v2.0</span>
        </div>

        <!-- Status -->
        <div class="status-card">
            <div class="status-indicator">
                <div class="dot checking" id="dot"></div>
                <span class="status-text" id="status">Checking...</span>
            </div>
            <div class="status-detail" id="detail">Connecting to daemon...</div>
        </div>

        <!-- Info -->
        <div class="info-grid">
            <div class="info-item">
                <div class="val" id="reqCount">0</div>
                <div class="lbl">Requests</div>
            </div>
            <div class="info-item">
                <div class="val" id="uptime">--</div>
                <div class="lbl">Uptime</div>
            </div>
        </div>

        <!-- Buttons -->
        <div class="btn-group">
            <button class="btn btn-start" id="btnStart" onclick="proxyAction('start')">
                ▶ Start Proxy
            </button>
            <button class="btn btn-stop" id="btnStop" onclick="proxyAction('stop')">
                ⏹ Stop Proxy
            </button>
            <button class="btn btn-apply" onclick="proxyAction('apply')">
                🔄 Apply System Bypass
            </button>
            <button class="btn btn-outline" onclick="loadStatus()">
                🔃 Refresh Status
            </button>
        </div>

        <!-- Logs -->
        <div class="log-section">
            <h3>📋 Activity Log <span class="badge" id="logCount">0</span></h3>
            <div id="log">Waiting for data...</div>
        </div>

        <!-- Footer -->
        <div class="footer">Blue Whale © 2024 | Localhost Only</div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        const API = '/api';
        let startTime = Date.now();

        // Toast
        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        // Proxy Actions
        async function proxyAction(action) {
            const btnStart = document.getElementById('btnStart');
            const btnStop = document.getElementById('btnStop');

            btnStart.disabled = true;
            btnStop.disabled = true;

            try {
                const r = await fetch(API + '/' + action, { method: 'POST' });
                const d = await r.json();

                if (d.success) {
                    toast('✅ ' + d.message);
                } else {
                    toast('❌ ' + d.message);
                }

                setTimeout(loadStatus, 800);
            } catch (e) {
                toast('⚠ Cannot connect to daemon');
            }

            setTimeout(() => {
                btnStart.disabled = false;
                btnStop.disabled = false;
            }, 2000);
        }

        // Load Status
        async function loadStatus() {
            const dot = document.getElementById('dot');
            const status = document.getElementById('status');
            const detail = document.getElementById('detail');
            const logEl = document.getElementById('log');
            const reqCount = document.getElementById('reqCount');
            const uptimeEl = document.getElementById('uptime');
            const logCount = document.getElementById('logCount');

            try {
                const r = await fetch(API + '/status');
                const d = await r.json();

                // Status
                if (d.running) {
                    dot.className = 'dot online';
                    status.textContent = 'ONLINE';
                    detail.textContent = 'Proxy running on port ' + (d.port || 80);
                } else {
                    dot.className = 'dot offline';
                    status.textContent = 'OFFLINE';
                    detail.textContent = 'Proxy not running';
                }

                // Stats
                reqCount.textContent = d.requests || '0';

                if (d.uptime) {
                    const mins = Math.floor(d.uptime / 60);
                    const hrs = Math.floor(mins / 60);
                    if (hrs > 0) {
                        uptimeEl.textContent = hrs + 'h ' + (mins % 60) + 'm';
                    } else {
                        uptimeEl.textContent = mins + 'm';
                    }
                } else {
                    uptimeEl.textContent = '--';
                }

                // Logs
                if (d.log) {
                    logEl.textContent = d.log;
                    const lines = d.log.split('\n').filter(l => l.trim());
                    logCount.textContent = lines.length;
                }

            } catch (e) {
                dot.className = 'dot offline';
                status.textContent = 'NO CONNECTION';
                detail.textContent = 'Daemon not responding';
                logEl.textContent = 'Error: Cannot reach daemon on port 8080.\nMake sure Blue Whale is running.';
            }
        }

        // Init
        loadStatus();
        setInterval(loadStatus, 5000);
    </script>
</body>
</html>

name: Build & Release

on:
  push:
    branches:
      - main
    paths:
      - 'module/**'
  workflow_dispatch:  # চাইলে ম্যানুয়ালিও চালানো যাবে

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Debug - Show changes
      run: |
        echo "=== Changed files ==="
        git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "No previous commit"
        echo "=== Module folder ==="
        ls -la module/ 2>/dev/null || echo "No module folder"
        echo "=== Module prop ==="
        cat module/module.prop 2>/dev/null || echo "No module.prop"

    - name: Get Version
      id: version
      run: |
        if [ ! -f "module/module.prop" ]; then
          echo "ERROR: module/module.prop not found!"
          exit 1
        fi
        VERSION=$(grep '^version=' module/module.prop | head -1 | cut -d'=' -f2)
        VERSION_CODE=$(grep '^versionCode=' module/module.prop | head -1 | cut -d'=' -f2)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "Version: $VERSION ($VERSION_CODE)"

    - name: Build ZIP
      run: |
        cd module
        zip -r9 ../BlueWhale-${{ steps.version.outputs.version }}.zip . -x "*.git*"
        cd ..
        ls -lh BlueWhale-${{ steps.version.outputs.version }}.zip

    - name: Create Tag
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        TAG="v${{ steps.version.outputs.version }}"
        git push origin :refs/tags/$TAG 2>/dev/null || true
        git tag -f $TAG
        git push origin $TAG --force
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Delete Old Release
      run: |
        gh release delete "v${{ steps.version.outputs.version }}" --yes 2>/dev/null || true
        sleep 2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: BlueWhale v${{ steps.version.outputs.version }}
        files: BlueWhale-${{ steps.version.outputs.version }}.zip
        body: |
          ## 🐋 Blue Whale v${{ steps.version.outputs.version }}

          | Item | Value |
          |------|-------|
          | Version | ${{ steps.version.outputs.version }} |
          | Version Code | ${{ steps.version.outputs.version_code }} |

          ### 📥 Installation
          1. Download **BlueWhale-${{ steps.version.outputs.version }}.zip**
          2. Open Magisk/KSU/APatch
          3. Modules → Install from storage
          4. Select ZIP → Reboot
          5. Open WebUI from module

          ### 🔗 Links
          - [Update JSON](https://raw.githubusercontent.com/${{ github.repository }}/main/update.json)
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update update.json
      run: |
        cat > update.json << EOF
        {
            "version": "${{ steps.version.outputs.version }}",
            "versionCode": ${{ steps.version.outputs.version_code }},
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/BlueWhale-${{ steps.version.outputs.version }}.zip",
            "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/main/CHANGELOG.md"
        }
        EOF
        cat update.json

    - name: Commit update.json
      run: |
        git add update.json
        git commit -m "🔄 Update to v${{ steps.version.outputs.version }}" || echo "No changes to commit"
        git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
